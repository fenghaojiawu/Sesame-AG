name: Auto Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时同步一次
  workflow_dispatch:        # 允许手动点击运行

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add Upstream Remote
        run: |
          # 这里填入了你截图中的地址
          git remote add upstream https://github.com/Sesame-AG/Sesame-AG.git

      - name: Fetch Upstream
        run: git fetch upstream

      - name: Merge Upstream into Main
        run: |
          # 注意：这里改成了 main，因为截图显示原项目主分支是 main
          git checkout main
          git merge upstream/main --strategy-option=theirs || echo "Merge failed or already up to date"
          
      - name: Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 推送到 main 分支
          git push origin main
