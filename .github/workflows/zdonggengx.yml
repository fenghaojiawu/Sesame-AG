name: Auto Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时运行一次，你可以改成 '0 0 * * *' (每天)
  workflow_dispatch:        # 允许手动点击运行

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 必须开启写入权限，否则无法推送代码

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0    # 获取完整历史记录

      - name: Add Upstream Remote
        run: |
          # 【重要】把下面的地址改成原项目的地址！
          # 看截图你的项目叫 Sesame-AG，原项目可能是 TGSAN/Sesame 或 Alin-x86/Sesame-AG
          git remote add upstream https://github.com/TGSAN/Sesame.git 
          # 如果原项目就是 Sesame-AG，请填 https://github.com/原作者用户名/Sesame-AG.git

      - name: Fetch Upstream
        run: git fetch upstream

      - name: Merge Upstream into Dev
        run: |
          git checkout dev
          # 尝试合并。如果有冲突，使用 --strategy-option=theirs 强制以上游代码为准
          git merge upstream/dev --strategy-option=theirs || echo "Merge failed or already up to date"
          
      - name: Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin dev
